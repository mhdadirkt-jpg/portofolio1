<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Adil</title>
<meta name="description" content="Brand identity, logo, poster and AI-integrated web design.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="section" style="min-height:80vh">
  <div class="wrap">
    <div id="gate" class="gate glass" style="border-radius:24px;padding:32px">
      <h1 class="display" style="font-size:1.8rem">Admin</h1>
      <form id="gate-form" style="margin-top:20px">
        <label for="pw">Password</label>
        <div class="field"><input id="pw" type="password" autocomplete="current-password" required></div>
        <p class="err" id="gate-err" role="alert"></p>
        <button class="liquid-btn" style="margin-top:20px;width:100%">Unlock</button>
      </form>
    </div>
    <div id="panel" hidden>
      <h1 class="display" style="font-size:2.4rem">Admin</h1>
      <div class="grid two" style="margin-top:32px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        <div class="stat glass"><p class="small">Projects</p><p class="n" id="count">0</p></div>
        <a class="stat glass" href="https://web3forms.com/dashboard" target="_blank" rel="noreferrer"><p class="small">Inbox</p><p>View enquiries (Web3Forms)</p></a>
        <a class="stat glass" href="mailto:mhdadirkt@gmail.com"><p class="small">Reply</p><p>mhdadirkt@gmail.com</p></a>
      </div>
      <h2 class="display" style="margin-top:56px;font-size:1.5rem">Projects</h2>
      <ul class="table" id="rows"></ul>
      <p class="small" style="margin-top:24px">Edit projects in the PROJECTS array in js/main.js.</p>
    </div>
  </div>
</main>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body></html>
